# Render blueprint: two services, because they have different shapes.
#
#   api      thin, always-on, 59.1 MB import RSS. Holds no model.
#   indexer  holds the ONNX model. 439 MB peak RSS, measured
#            (bench/bench_colocated_rss.py). Serves /embed for the API's
#            query path and runs the indexing worker.
#
# They are separate because colocating them peaks at 485 MB on a 512 MB
# instance -- 27 MB of headroom, which is no room to serve requests. The indexer is
# sized right at the limit even alone: 439 MB of 512 MB, ~73 MB headroom.
#
# Both install from pyproject.toml. There is no requirements.txt: it had
# drifted to the v1 dependency set (chromadb, langgraph, redis) that nothing
# imports any more, so a deploy installed ~300 MB of dead weight and missed
# what v2 needs.
services:
  - type: web
    name: clarix-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install .
    # Migrations run here, not in `preDeployCommand`, because Render does
    # not support a pre-deploy command on the free plan -- the Blueprint is
    # rejected outright with "pre-deploy command is not supported for free
    # tier services".
    #
    # Chaining onto the start command is the next best thing: `alembic
    # upgrade head` is idempotent, so a cold start on an already-current
    # database is a no-op, and a failed migration stops the service from
    # coming up rather than serving against a schema it does not match.
    # Only the API does this; the indexer must not race it.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      # Point the API at the indexer's embedding endpoint. Without this the
      # dense retrieval arm is disabled and only lexical + symbol run.
      - key: EMBEDDING_ENDPOINT
        fromService:
          name: clarix-indexer
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Read from the indexer rather than generated here. Two
      # `generateValue` entries produce two DIFFERENT random secrets, the
      # indexer rejects the API's bearer token with 401, and the dense arm
      # silently switches off -- which is exactly the failure this whole
      # service was added to fix, reintroduced through configuration.
      - key: EMBEDDING_API_KEY
        fromService:
          name: clarix-indexer
          type: web
          envVarKey: EMBEDDING_API_KEY
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: clarix-indexer
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install '.[indexer]'
    startCommand: python -m app.indexing --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production
      # Generated here and read by the API via `fromService`, so the two
      # sides cannot drift apart. The endpoint runs a model on
      # caller-supplied text, and app.indexing.service refuses to start in
      # production without this set.
      - key: EMBEDDING_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Cache the model between deploys so a restart does not re-download
      # 306 MB before it can answer.
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
