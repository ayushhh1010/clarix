[project]
name = "clarix"
version = "2.0.0"
description = "Repository-aware code intelligence: hybrid retrieval, AST-grounded chunking, measured end to end."
requires-python = ">=3.11,<3.13"

# ---------------------------------------------------------------------------
# API server dependencies.
#
# This list is deliberately thin. It is the dependency set that gets imported
# by the always-on web process, and its import-time RSS is the binding
# constraint on our deployment target (512 MB on Koyeb's free instance).
#
# Anything that loads a model, parses source code, or pulls numpy/onnx belongs
# in the `indexer` extra and runs out-of-process. See bench/bench_import_rss.py
# for the measured cost of this split.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",

    # Persistence. pgvector ships the SQLAlchemy column types for
    # vector/halfvec/bit; it is a pure-Python adapter, not a client library.
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "pgvector==0.4.1",

    # Outbound HTTP to model providers, and to the indexer's embedding
    # endpoint from the query path. One client, all callers.
    "httpx==0.28.1",

    # Migrations only. Alembic cannot run on asyncpg, so alembic/env.py
    # rewrites the URL to postgresql+psycopg; the application itself never
    # uses this driver. It stays in the base set because the release step
    # runs `alembic upgrade head` in this same image.
    "psycopg[binary,pool]==3.2.10",

    # Auth. PyJWT over python-jose (maintained, smaller); bcrypt directly over
    # passlib (passlib 1.7.4 is unmaintained and breaks against bcrypt>=4.1).
    "pyjwt[crypto]==2.10.1",
    "bcrypt==4.3.0",
    "email-validator==2.3.0",

    # Accurate token accounting. `len(text)//4` under-counts code badly; see
    # bench/bench_token_estimate.py. This is the real tokenizer, ~2 MB.
    "tokenizers==0.22.1",

    # Rate limiting (app/rate_limit.py, app/main.py).
    "slowapi==0.1.9",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
# -------------------------------------------------------------------------
# Backward-compatibility tests only.
#
# The v1 modules are gone; these remain solely so
# tests/test_security.py can mint a passlib hash and a python-jose token
# and prove the migrated code still verifies both. Nothing in app/ imports
# them, which tests/test_imports.py enforces at the import hook.
# -------------------------------------------------------------------------
compat-tests = [
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
]

# -------------------------------------------------------------------------
# Indexer (`python -m app.indexing`). Serves the embedding endpoint the API
# calls for query vectors, and runs the indexing worker, in one process.
#
# Never inside the API container: measured peak RSS is 439 MB here against
# the API's 59.1 MB, and the two together peak at 485 MB of a 512 MB instance
# (bench/bench_colocated_rss.py). fastapi and uvicorn come from the base
# set; only the model and parser stack is extra.
# -------------------------------------------------------------------------
indexer = [
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.9.0",
    "onnxruntime==1.22.1",
    "numpy==2.3.3",
    "huggingface-hub==0.35.1",
]

# -------------------------------------------------------------------------
# Evaluation harness. Statistics live here, not in the serving path.
# -------------------------------------------------------------------------
eval = [
    "numpy==2.3.3",
    "scipy==1.16.2",
    "pandas==2.3.2",
]

dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
    "ruff==0.13.2",
    "mypy==1.18.2",
    "psutil==7.1.0",
    # PostgreSQL 18.6 + pgvector 0.8.6 as a wheel. The schema and retrieval
    # tests run real SQL against a real server; a suite that needs a Docker
    # daemon is a suite that gets skipped.
    "embedded-postgres==18.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; pseudo-random is test data, not crypto;
# SQL is built from literals in fixtures; teardown swallows errors on purpose
# so a cleanup failure cannot mask the real test failure.
# S105/S106: test fixtures deliberately contain literal secrets and
# pad tokens; they are the subject of the test, not a leak.
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S608", "S110", "SIM105"]
"bench/**" = ["S101", "S603", "S607", "S311", "S608"]
"alembic/**" = ["SIM103"]
# See the NOTE at the top of the SQL constants: only module-level
# constants are interpolated; all user input uses bind parameters.
# S608 in these three: the f-strings interpolate only module-level
# constants (column lists, EMBED_DIM, a literal filter clause). Every value
# that originates outside the module -- query text, repo ids, chunk fields,
# job kinds -- is passed as a bind parameter and never formatted into SQL.
# An inline suppression is not usable: ruff reports the opening `f"""` line,
# so the comment would land inside the string literal and corrupt the query.
"app/retrieval/hybrid.py" = ["S608"]
"app/indexing/pipeline.py" = ["S608"]
"app/indexing/queue.py" = ["S608"]
# S105 flags any name containing "token"/"secret" assigned a literal.
# These are a default placeholder (rejected in production by
# security._check_secret), two OAuth endpoint URLs, and the literal
# "bearer" -- none is a credential.
"app/config.py" = ["S105"]
"app/routes/auth.py" = ["S105"]
"app/schemas.py" = ["S105"]
# Routers are imported after `app` is constructed to avoid a circular
# import; E402 is the cost of that ordering.
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
