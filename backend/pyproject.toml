[project]
name = "clarix"
version = "2.0.0"
description = "Repository-aware code intelligence: hybrid retrieval, AST-grounded chunking, measured end to end."
requires-python = ">=3.11,<3.13"

# ---------------------------------------------------------------------------
# API server dependencies.
#
# This list is deliberately thin. It is the dependency set that gets imported
# by the always-on web process, and its import-time RSS is the binding
# constraint on our deployment target (512 MB on Koyeb's free instance).
#
# Anything that loads a model, parses source code, or pulls numpy/onnx belongs
# in the `indexer` extra and runs out-of-process. See bench/bench_import_rss.py
# for the measured cost of this split.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",

    # Persistence. pgvector ships the SQLAlchemy column types for
    # vector/halfvec/bit; it is a pure-Python adapter, not a client library.
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "pgvector==0.4.1",

    # Outbound HTTP to model providers. One client, all providers.
    "httpx==0.28.1",

    # Agent graph + durable checkpointing. We take langgraph's core and its
    # Postgres checkpointer, and nothing else from that ecosystem: no
    # langchain, no community adapters, no per-provider shims.
    "langgraph==0.6.8",
    "langgraph-checkpoint-postgres==2.0.24",
    "psycopg[binary,pool]==3.2.10",

    # Streaming responses.
    "sse-starlette==3.0.2",

    # Auth. PyJWT over python-jose (maintained, smaller); bcrypt directly over
    # passlib (passlib 1.7.4 is unmaintained and breaks against bcrypt>=4.1).
    "pyjwt[crypto]==2.10.1",
    "bcrypt==4.3.0",
    "email-validator==2.3.0",

    # Accurate token accounting. `len(text)//4` under-counts code badly; see
    # bench/bench_token_estimate.py. This is the real tokenizer, ~2 MB.
    "tokenizers==0.22.1",
]

[project.optional-dependencies]
# -------------------------------------------------------------------------
# Indexer. Runs on Modal (serverless, scale-to-zero) or as a separate local
# process -- never inside the API container.
# -------------------------------------------------------------------------
indexer = [
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.9.0",
    "onnxruntime==1.22.1",
    "numpy==2.3.3",
    "huggingface-hub==0.35.1",
]

# -------------------------------------------------------------------------
# Evaluation harness. Statistics live here, not in the serving path.
# -------------------------------------------------------------------------
eval = [
    "numpy==2.3.3",
    "scipy==1.16.2",
    "pandas==2.3.2",
]

dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==7.0.0",
    "ruff==0.13.2",
    "mypy==1.18.2",
    "psutil==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"bench/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
